<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs><linearGradient id="isky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb0f0"/><stop offset="1" stop-color="#b7e3fc"/></linearGradient></defs>
<rect width="240" height="240" fill="url(#isky)"/>
<g fill="#ffffff" opacity="0.92"><circle cx="182" cy="52" r="11"/><circle cx="196" cy="46" r="14"/><circle cx="210" cy="54" r="9"/><rect x="172" y="54" width="44" height="9" rx="4.5"/></g>
<g fill="#ffffff" opacity="0.8"><circle cx="38" cy="66" r="7"/><circle cx="48" cy="61" r="9"/><circle cx="58" cy="67" r="6"/><rect x="32" y="67" width="31" height="6" rx="3"/></g>
<g transform="translate(120 146) scale(1.75) translate(-120 -96)">
  <defs>
    <radialGradient id="wool" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fbf7f4"/>
      <stop offset="1" stop-color="#e6dcea"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4f4756"/>
      <stop offset="1" stop-color="#36303c"/>
    </radialGradient>
    <pattern id="stitch" width="9" height="8" patternUnits="userSpaceOnUse">
      <path d="M1.5 1.5 L4.5 6 L7.5 1.5" fill="none" stroke="#d9cede" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
    <pattern id="knit" width="7" height="6" patternUnits="userSpaceOnUse">
      <rect width="7" height="6" fill="#5aa3df"/>
      <path d="M1 1 L3.5 5 L6 1" fill="none" stroke="#3f86c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </pattern>
  </defs>

