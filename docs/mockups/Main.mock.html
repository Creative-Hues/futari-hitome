<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ふたりひとめ ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3f86c4}a:hover{color:#2f6aa3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fbf7f2; color: #3f3846; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 500; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px">ふたりひとめ</h1>
    <button aria-label="設定" style="width: 44px; height: 44px; border: 0; background: #ffffff; border-radius: 22px; box-shadow: 0 2px 0 #ebe2da; display: flex; align-items: center; justify-content: center; padding: 0; color: #5b5263">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section aria-label="パートナーの部屋" style="margin: 4px 20px 0; border-radius: 24px; position: relative; height: 330px; overflow: hidden; box-shadow: 0 3px 0 #ebe2da">
    <img src="../../assets/backgrounds/room_example_0.svg" alt="" width="350" height="330" style="position: absolute; left: 0; top: 0; width: 350px; height: 330px">
    <button aria-label="ひつじにさわる" style="position: absolute; left: 95px; bottom: 22px; background: none; border: 0; padding: 0">
      <img src="../../assets/animals/sheep.svg" alt="" width="210" height="210" style="display: block; width: 210px; height: 210px">
    </button>
    <p style="position: absolute; left: 12px; top: 150px; margin: 0; background: #ffffff; border-radius: 14px; padding: 8px 12px; font-size: 12px; line-height: 1.6; box-shadow: 0 2px 0 #ebe2da; white-space: nowrap">きょうも<br>いっしょに<br>あもうね</p>
  </section>

  <section aria-labelledby="wip" style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px; flex: 1">
    <h2 id="wip" style="margin: 0; font-size: 17px; font-weight: 700">編みかけの作品</h2>
    <a href="Knit.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; background: #ffffff; border-radius: 18px; box-shadow: 0 2px 0 #ebe2da; text-decoration: none; color: #3f3846">
      <span style="width: 52px; height: 52px; border-radius: 14px; background: #eaf5fd; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><img src="../../assets/animals/sheep.svg" alt="ひつじ" width="48" height="48" style="width: 48px; height: 48px"></span>
      <span style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0">
        <span style="font-weight: 700; font-size: 15px">青いマフラー</span>
        <span style="font-size: 12px; color: #6e6577">首 ・ ひつじ と 編んでいる</span>
        <span style="height: 8px; background: #f0e8e2; border-radius: 4px; overflow: hidden"><span style="display: block; width: 52%; height: 100%; background: #5aa3df; border-radius: 4px"></span></span>
      </span>
      <span style="font-size: 14px; font-weight: 700">42/80段</span>
    </a>
    <a href="Knit.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; background: #ffffff; border-radius: 18px; box-shadow: 0 2px 0 #ebe2da; text-decoration: none; color: #3f3846">
      <span style="width: 52px; height: 52px; border-radius: 14px; background: #eaf5fd; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><img src="../../assets/animals/seal.svg" alt="アザラシ" width="48" height="48" style="width: 48px; height: 48px"></span>
      <span style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0">
        <span style="font-weight: 700; font-size: 15px">さくら色のニット帽</span>
        <span style="font-size: 12px; color: #6e6577">頭 ・ アザラシ と 編んでいる</span>
        <span style="height: 8px; background: #f0e8e2; border-radius: 4px; overflow: hidden"><span style="display: block; width: 25%; height: 100%; background: #f2a6b4; border-radius: 4px"></span></span>
      </span>
      <span style="font-size: 14px; font-weight: 700">だいたい</span>
    </a>
    <button style="margin-top: 4px; height: 54px; background: #5aa3df; color: #ffffff; border: 0; border-radius: 27px; font-family: inherit; font-size: 17px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 3px 0 #3f86c4">＋ 新しく編む</button>
  </section>

  <nav aria-label="メニュー" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #ffffff; margin-top: 16px; border-top: 1px solid #efe6df; padding: 6px 12px 10px">
    <a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; text-decoration: none; color: #3f86c4; font-size: 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v9h14v-9"/></svg>ホーム</a>
    <a href="#" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #8a8192; font-size: 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>アルバム</a>
    <a href="Partners.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #8a8192; font-size: 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="6"/><circle cx="7" cy="6" r="2.5"/><circle cx="17" cy="6" r="2.5"/></svg>なかま</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
